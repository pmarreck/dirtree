name: CI

on:
  push:
    branches: [yolo]
    tags: ["v*"]
  pull_request:
    branches: [yolo]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-macos
            os: macos-latest
            zig-target: ""
            can-test: true
            artifact-name: dirtree-aarch64-macos
          - name: x86_64-macos
            os: macos-latest
            zig-target: x86_64-macos
            can-test: false
            artifact-name: dirtree-x86_64-macos
          - name: x86_64-linux-musl
            os: ubuntu-latest
            zig-target: x86_64-linux-musl
            can-test: true
            artifact-name: dirtree-x86_64-linux-musl
          - name: aarch64-linux-musl
            os: ubuntu-latest
            zig-target: aarch64-linux-musl
            can-test: false
            artifact-name: dirtree-aarch64-linux-musl

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Doptimize=ReleaseFast ${{ matrix.zig-target && format('-Dtarget={0}', matrix.zig-target) || '' }}

      - name: Unit tests
        if: matrix.can-test
        run: zig build test ${{ matrix.zig-target && format('-Dtarget={0}', matrix.zig-target) || '' }}

      - name: Install test dependencies
        if: matrix.can-test && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Install test dependencies (macOS)
        if: matrix.can-test && runner.os == 'macOS'
        run: brew install bash luajit || true

      - name: Install printable-binary (test dependency)
        if: matrix.can-test
        run: |
          git clone --depth 1 https://github.com/pmarreck/printable_binary.git /tmp/printable_binary
          echo "/tmp/printable_binary/bin" >> $GITHUB_PATH

      - name: Integration tests
        if: matrix.can-test
        run: |
          export PATH="$PWD/zig-out/bin:$PATH"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "$(brew --prefix)/bin/bash" test/dirtree_test
          else
            bash test/dirtree_test
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: zig-out/bin/dirtree

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release binaries
        run: |
          for dir in artifacts/dirtree-*; do
            name=$(basename "$dir")
            mv "$dir/dirtree" "$name"
            chmod +x "$name"
          done

      - name: Rolling release (latest)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Rolling release from `${{ github.sha }}` on `yolo`."
          prerelease: true
          make_latest: false
          files: dirtree-*

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dirtree-*
          generate_release_notes: true
