name: CI

on:
  push:
    branches: [yolo]
    tags: ["v*"]
  pull_request:
    branches: [yolo]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aarch64-macos
            os: macos-latest
            zig-target: ""
            can-test: true
            artifact-name: dirtree-aarch64-macos
          - name: x86_64-macos
            os: macos-latest
            zig-target: x86_64-macos
            can-test: false
            artifact-name: dirtree-x86_64-macos
          - name: x86_64-linux-musl
            os: ubuntu-latest
            zig-target: x86_64-linux-musl
            can-test: true
            artifact-name: dirtree-x86_64-linux-musl
          - name: aarch64-linux-musl
            os: ubuntu-latest
            zig-target: aarch64-linux-musl
            can-test: false
            artifact-name: dirtree-aarch64-linux-musl

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          version="0.16.0"
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform="x86_64-linux"; ext="tar.xz" ;;
            Linux-ARM64) platform="aarch64-linux"; ext="tar.xz" ;;
            macOS-X64) platform="x86_64-macos"; ext="tar.xz" ;;
            macOS-ARM64) platform="aarch64-macos"; ext="tar.xz" ;;
            Windows-X64) platform="x86_64-windows"; ext="zip" ;;
            *) echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/zig.$ext"
          install_dir="$RUNNER_TEMP/zig"
          curl -fsSL "https://ziglang.org/download/${version}/zig-${platform}-${version}.${ext}" -o "$archive"
          mkdir -p "$install_dir"
          if [ "$ext" = "zip" ]; then
            unzip -q "$archive" -d "$install_dir"
          else
            tar -xf "$archive" -C "$install_dir"
          fi
          zig_dir="$(find "$install_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version

      - name: Build
        run: zig build -Doptimize=ReleaseFast ${{ matrix.zig-target && format('-Dtarget={0}', matrix.zig-target) || '' }}

      - name: Unit tests
        if: matrix.can-test
        run: zig build test ${{ matrix.zig-target && format('-Dtarget={0}', matrix.zig-target) || '' }}

      - name: Install test dependencies
        if: matrix.can-test && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y luajit ripgrep

      - name: Install test dependencies (macOS)
        if: matrix.can-test && runner.os == 'macOS'
        run: brew install bash luajit ripgrep || true

      - name: Install printable-binary (test dependency)
        if: matrix.can-test
        run: |
          git clone --depth 1 https://github.com/pmarreck/printable-binary.git /tmp/printable-binary
          echo "/tmp/printable-binary/bin" >> $GITHUB_PATH

      - name: Integration tests
        if: matrix.can-test
        run: |
          export PATH="$PWD/zig-out/bin:$PATH"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "$(brew --prefix)/bin/bash" test/dirtree_test
          else
            bash test/dirtree_test
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: zig-out/bin/dirtree

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release binaries
        run: |
          for dir in artifacts/dirtree-*; do
            name=$(basename "$dir")
            mv "$dir/dirtree" "$name"
            chmod +x "$name"
          done

      - name: Rolling release (latest)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Rolling release from `${{ github.sha }}` on `yolo`."
          prerelease: true
          make_latest: false
          files: dirtree-*

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dirtree-*
          generate_release_notes: true
